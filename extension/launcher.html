<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseNest</title><link rel="stylesheet" href="launcher.css"></head>
<body>
  <header><span class="mark">P</span><div><h1>PhraseNest</h1><p>保存した英語を、すぐに確認</p></div></header>
  <nav aria-label="PhraseNestメニュー">
    <a data-tab="today"><strong>今日の復習</strong><span>意味を思い出す</span></a>
    <a data-tab="words"><strong>単語・熟語</strong><span>意味と登場回数</span></a>
    <a data-tab="sentences"><strong>保存した英文</strong><span>文脈と日本語訳</span></a>
    <a data-tab="notes"><strong>学習メモ</strong><span>コアイメージ・自由メモ</span></a>
    <a data-tab="organize"><strong>Codex整理</strong><span>未整理分の確認</span></a>
  </nav>
  <button id="translate" type="button">Redditの選択した英文を開く</button>
  <p id="message" role="status">英文を選択して Ctrl + Shift + Y でも開けます。</p>
  <button id="settings" type="button" class="settings">拡張機能の設定</button>
  <script src="launcher.js"></script>
</body>
</html>
